<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anterior Lower Limb — Case Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F4F3; --surface:#FFFFFF; --surface-2:#F7FAF9;
    --ink:#16231F; --ink-soft:#4C5C57; --ink-faint:#7C8B86;
    --rail:#0E1C18; --rail-ink:#B7C8C2; --rail-ink-dim:#66807A;
    --jade:#1C7A6A; --jade-deep:#125A4E; --jade-soft:#E1EFEB; --jade-line:#B7D8D0;
    --crimson:#A63A44; --crimson-soft:#F6E7E8; --crimson-line:#E3BEC1;
    --amber:#B07A22; --amber-soft:#F6ECD8;
    --hl:#FBEBA0;
    --line:#D8E1DE; --line-soft:#E6ECEA;
    --shadow:0 1px 2px rgba(16,32,28,.04), 0 8px 28px rgba(16,32,28,.07);
    --shadow-lg:0 18px 60px rgba(16,32,28,.22);
    --sans:'Archivo',system-ui,sans-serif;
    --serif:'Newsreader',Georgia,serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --rail-w:296px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* ---------- Rail ---------- */
  .shell{display:flex; min-height:100vh}
  .rail{
    width:var(--rail-w); flex:0 0 var(--rail-w);
    background:var(--rail); color:var(--rail-ink);
    position:sticky; top:0; align-self:flex-start; height:100vh;
    display:flex; flex-direction:column; padding:24px 0 16px;
  }
  .rail-head{padding:0 24px 18px; border-bottom:1px solid rgba(255,255,255,.07)}
  .rail-kicker{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--rail-ink-dim)}
  .rail-title{font-weight:800; font-size:19px; line-height:1.15; color:#fff; margin:8px 0 4px; letter-spacing:-.01em}
  .rail-sub{font-family:var(--serif); font-style:italic; font-size:13.5px; color:var(--rail-ink-dim)}
  .pathway{list-style:none; margin:0; padding:14px 12px; overflow-y:auto; flex:1}
  .path-item{
    display:flex; gap:12px; align-items:flex-start; width:100%;
    background:none; border:0; text-align:left; cursor:pointer;
    color:var(--rail-ink); padding:12px 12px; border-radius:10px;
    font-family:var(--sans); font-size:14px; line-height:1.3;
  }
  .path-item:hover{background:rgba(255,255,255,.05)}
  .path-item:focus-visible{outline:2px solid var(--jade); outline-offset:2px}
  .path-item.active{background:rgba(255,255,255,.08)}
  .path-item.active .path-name{color:#fff}
  .path-marker{
    flex:0 0 26px; height:26px; border-radius:7px; margin-top:1px; display:grid; place-items:center;
    font-family:var(--mono); font-size:12px; font-weight:600;
    background:rgba(255,255,255,.06); color:var(--rail-ink-dim); border:1px solid rgba(255,255,255,.09);
  }
  .path-item.active .path-marker{background:var(--jade); color:#fff; border-color:var(--jade)}
  .path-item.done .path-marker{background:transparent; color:var(--jade); border-color:var(--jade)}
  .path-item.done .path-marker::after{content:"\2713"}
  .path-item.done .path-marker .mk-num{display:none}
  .path-name{font-weight:600; color:var(--rail-ink); display:block}
  .path-pages{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--rail-ink-dim); margin-top:3px}
  .rail-foot{padding:12px 18px 0; border-top:1px solid rgba(255,255,255,.07); margin:6px 12px 0}
  .rail-progress{font-family:var(--mono); font-size:11px; color:var(--rail-ink-dim)}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .topbar{
    position:sticky; top:0; z-index:20; background:rgba(241,244,243,.9);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 26px;
  }
  .topbar-l{display:flex; align-items:center; gap:12px; min-width:0}
  .crumb{font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .crumb b{color:var(--jade); font-weight:600}
  .topbar-r{display:flex; align-items:center; gap:9px; flex:0 0 auto}
  .chip{
    display:inline-flex; align-items:center; gap:8px; background:var(--surface);
    border:1px solid var(--line); color:var(--ink-soft); font-family:var(--sans);
    font-weight:600; font-size:13px; padding:9px 13px; border-radius:9px; box-shadow:var(--shadow); white-space:nowrap;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--jade)}
  .chip .cnt{font-family:var(--mono); font-size:12.5px; color:var(--ink); font-weight:600}
  button.chip{cursor:pointer}
  button.chip:hover{border-color:var(--jade-line); color:var(--ink)}
  button.chip:focus-visible{outline:2px solid var(--jade); outline-offset:2px}

  .stage{flex:1; padding:34px 26px 90px; max-width:860px; width:100%; margin:0 auto}

  .eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--jade); font-weight:500; display:flex; align-items:center; gap:10px}
  .eyebrow .rule{height:1px; width:26px; background:var(--jade-line)}
  h1.step-title{font-weight:800; letter-spacing:-.02em; font-size:33px; line-height:1.08; margin:13px 0 0}

  /* Grant's page banner — prominent, directs activity */
  .grants{
    margin-top:16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--jade-deep); color:#fff; border-radius:13px; padding:15px 20px; box-shadow:var(--shadow);
    text-decoration:none; cursor:pointer; transition:filter .15s ease;
  }
  .grants:hover{filter:brightness(1.08)}
  .grants:focus-visible{outline:2px solid #fff; outline-offset:2px}
  .ga-go{
    margin-left:auto; font-family:var(--mono); font-size:11.5px; letter-spacing:.05em; color:#CFE7E1;
    white-space:nowrap; flex:0 0 auto;
  }
  .grants .gl{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:#9FD3C8}
  .grants .gp{font-weight:800; font-size:22px; letter-spacing:-.01em; line-height:1}
  .grants .gt{font-family:var(--serif); font-style:italic; font-size:14.5px; color:#CFE7E1; flex:1; min-width:200px}

  .step-lede{font-family:var(--serif); font-size:19px; line-height:1.5; color:var(--ink-soft); margin:16px 0 0; max-width:64ch}

  /* ---- Figure ---- */
  .vidcard{
    display:flex; align-items:center; gap:14px; text-decoration:none; margin-top:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:13px;
    padding:14px 18px; box-shadow:var(--shadow); color:var(--ink);
  }
  .vidcard:hover{border-color:var(--jade-line)}
  .vplay{
    flex:0 0 38px; height:38px; border-radius:50%; background:var(--crimson); color:#fff;
    display:grid; place-items:center; font-size:14px; padding-left:2px;
  }
  .vtxt{flex:1; min-width:0; display:flex; flex-direction:column}
  .vk{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint)}
  .vt{font-weight:600; font-size:15px; margin-top:2px}
  .vgo{font-family:var(--mono); font-size:11px; color:var(--jade); letter-spacing:.06em; flex:0 0 auto}
  .vnote{font-family:var(--serif); font-style:italic; font-size:13px; color:var(--ink-faint); margin:7px 4px 0; line-height:1.45}
  .figbox{margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden}
  .figbox img{display:block; width:100%; height:auto}
  .figph{
    display:grid; place-items:center; text-align:center; padding:38px 22px; background:var(--surface-2);
    border-bottom:1px dashed var(--jade-line); color:var(--ink-faint);
  }
  .figph .ic{font-size:26px; margin-bottom:8px; opacity:.5}
  .figph .t{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase}
  .figph .s{font-family:var(--serif); font-style:italic; font-size:14px; margin-top:6px; max-width:46ch}
  .figsvg{display:grid; place-items:center; background:var(--surface-2); padding:14px; border-bottom:1px solid var(--line-soft)}
  .figsvg svg{width:auto; height:250px; max-width:100%}
  .figcap{padding:11px 18px; font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase}

  /* ---- Structures ---- */
  .rstructs{margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden}
  .rstructs-head{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:15px 20px; border-bottom:1px solid var(--line-soft); background:var(--surface-2); flex-wrap:wrap}
  .rstructs-head .lbl{font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--jade); font-weight:500; display:flex; align-items:center; gap:7px}
  .rstructs-head .sub{font-family:var(--serif); font-style:italic; font-size:13.5px; color:var(--ink-soft); margin-top:3px}
  .rstructs-meta{display:flex; align-items:center; gap:11px; flex:0 0 auto}
  .meterbar{width:92px; height:7px; border-radius:99px; background:var(--line-soft); overflow:hidden}
  .meterbar span{display:block; height:100%; width:0; background:var(--jade); transition:width .3s ease}
  .meter-txt{font-family:var(--mono); font-size:12px; color:var(--ink-soft); font-weight:500; white-space:nowrap}
  .icon-btn{background:none; border:1px solid var(--line); border-radius:8px; width:32px; height:32px; cursor:pointer; color:var(--ink-soft); font-size:13px; flex:0 0 auto; line-height:1}
  .icon-btn:hover{border-color:var(--jade-line); color:var(--ink)}
  .icon-btn:focus-visible{outline:2px solid var(--jade); outline-offset:2px}
  .helpq{
    width:19px; height:19px; border-radius:50%; border:1px solid var(--jade-line); background:var(--surface);
    color:var(--jade); font-family:var(--mono); font-size:11px; font-weight:600; cursor:pointer;
    display:inline-grid; place-items:center; padding:0; position:relative;
  }
  .helpq:focus-visible{outline:2px solid var(--jade); outline-offset:2px}
  /* the "?" tooltip content now lives in the single shared #floatTip overlay below,
     which is position:fixed and appended at the end of <body> - it can never expand
     a column, row, or any other element, since it isn\u2019t a descendant of them. */
  .rstructs-body{padding:6px 16px 16px; columns:2; column-gap:32px}
  /* A category is never split across columns: the column can only break
     BETWEEN categories, so the right column always starts on a new heading. */
  .stype-group{break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid; margin-top:14px}
  .srow{break-inside:avoid; -webkit-column-break-inside:avoid}
  /* With only one category there is no legal break point, so use one full-width column
     rather than leaving an empty column. */
  .rstructs-body.onecol{columns:1}
  .stype{font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin:0 0 5px 4px; display:flex; align-items:center; gap:7px}
  .swatch{width:10px; height:10px; border-radius:3px; flex:0 0 10px; background:currentColor}
  .legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:9px}
  .legend .lg{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:500}
  /* structure colour coding */
  .cat-artery{color:#C0392B}
  .cat-vein{color:#2563A8}
  .cat-nerve{color:#A07C12}
  .cat-bone{color:#1A1A1A}
  .cat-muscle{color:#6B3F2A}
  .cat-connective{color:#4A5450}
  .cat-organ{color:#7B4EA8}
  .cat-other{color:#1C7A6A}
  .srow .sname{color:inherit}
  .srow .sbox{border-color:currentColor}
  .sline.seen .sbox{background:currentColor !important; border-color:currentColor !important}
  .sline.seen .sname{text-decoration-color:currentColor}
  .srow .slabel .org{color:inherit; opacity:.75}
  .srow .deg{color:inherit}
  .shelp{color:inherit}
  .shelp:hover{border-color:currentColor}
  .tendon-note{
    font-family:var(--serif); font-style:italic; font-size:13px; color:var(--amber);
    background:var(--amber-soft); border-radius:8px; padding:8px 11px; margin:0 4px 8px; line-height:1.45;
  }
  /* larger touch targets */
  .sline{
    display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left;
    background:none; border:0; cursor:pointer; font-family:var(--sans); font-size:14.5px;
    color:var(--ink); padding:11px 8px; border-radius:9px; line-height:1.35; min-height:44px;
  }
  .sline:hover{background:var(--surface-2)}
  .sline:focus-visible{outline:2px solid var(--jade); outline-offset:1px}
  .sbox{
    flex:0 0 22px; width:22px; height:22px; border-radius:6px; border:1.8px solid var(--ink-faint);
    display:grid; place-items:center; transition:all .15s ease;
  }
  .sbox svg{width:13px; height:13px; opacity:0; transform:scale(.6); transition:all .15s ease}
  .sline.seen .sbox{background:var(--jade); border-color:var(--jade)}
  .sline.seen .sbox svg{opacity:1; transform:scale(1)}
  .sline.seen .slabel{color:inherit}
  .sline.seen .sname{opacity:.5}
  .sline.seen .sname{text-decoration:line-through; text-decoration-color:var(--jade); text-decoration-thickness:1.5px}
  .slabel .sname{display:inline}
  .slabel .org{font-family:var(--serif); font-style:italic; color:var(--ink-soft)}
  .slabel .deg{color:var(--jade); font-weight:600}
  .prevmark{display:inline-block; text-decoration:none; font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); letter-spacing:.02em; margin-top:2px; text-decoration:none}
  .srow{position:relative; display:flex; align-items:flex-start; gap:3px}
  .srow .sline{flex:1; min-width:0}
  .shelp{
    flex:0 0 26px; width:26px; height:26px; margin-top:10px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface); color:var(--jade);
    font-family:var(--mono); font-size:12px; font-weight:600; cursor:pointer;
    display:grid; place-items:center; padding:0; line-height:1;
  }
  .shelp:hover{border-color:var(--jade-line); background:var(--jade-soft)}
  .shelp:focus-visible{outline:2px solid var(--jade); outline-offset:2px}
  .srow.tipopen .shelp{background:var(--jade); border-color:var(--jade); color:#fff}
  .floattip{
    display:none; position:fixed; z-index:120; width:min(300px,84vw); max-width:calc(100vw - 24px);
    background:var(--rail); color:#E7EFEC; font-family:var(--sans); font-size:13px; font-weight:400;
    line-height:1.5; padding:11px 13px; border-radius:10px; box-shadow:var(--shadow-lg); text-align:left;
  }
  .floattip b{color:#fff}
  .floattip.show{display:block}
  .rstructs.collapsed .rstructs-body{display:none}

  /* ---- Word origins ---- */
  .etymology{
    margin-top:22px; background:#FBF8F1; border:1px solid #E6DCC3; border-radius:16px;
    padding:19px 24px; box-shadow:var(--shadow);
  }
  .etymology .ety-k{
    font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase;
    color:#96772C; margin-bottom:11px;
  }
  .ety-item{display:flex; gap:14px; align-items:baseline; margin-bottom:9px}
  .ety-item:last-child{margin-bottom:0}
  .ety-term{
    flex:0 0 auto; font-family:var(--serif); font-style:italic; font-weight:600; font-size:15.5px;
    color:#5C4A1E; min-width:118px;
  }
  .ety-def{font-size:14px; line-height:1.55; color:var(--ink-soft)}
  @media (max-width:640px){ .ety-item{flex-direction:column; gap:2px} .ety-term{min-width:0} }

  /* ---- MCQ ---- */
  .mcq{margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:23px 25px 21px}
  .mcq-label{font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--jade); margin-bottom:10px}
  .mcq-stem{font-weight:700; font-size:17.5px; line-height:1.4; margin:0 0 17px}
  .opts{display:grid; gap:11px}
  .opt{text-align:left; width:100%; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0; overflow:hidden; font-family:var(--sans)}
  .opt:hover:not(.revealed){border-color:var(--jade-line)}
  .opt:focus-visible{outline:2px solid var(--jade); outline-offset:2px}
  .opt-row{display:flex; gap:13px; align-items:flex-start; padding:15px 16px; min-height:48px}
  .opt-key{flex:0 0 28px; height:28px; border-radius:7px; background:var(--surface-2); border:1px solid var(--line); display:grid; place-items:center; font-family:var(--mono); font-weight:600; font-size:13px; color:var(--ink-soft)}
  .opt-text{font-size:15px; line-height:1.45; padding-top:3px}
  .opt-fb{display:grid; grid-template-rows:0fr; transition:grid-template-rows .26s ease; font-size:14px; line-height:1.5}
  .opt.revealed .opt-fb{grid-template-rows:1fr}
  .opt-fb-inner{overflow:hidden}
  .opt-fb-inner p{margin:0; padding:0 16px 15px 57px}
  .opt-fb-inner .verdict{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; display:inline-block; margin-bottom:5px}
  .opt.correct{border-color:var(--jade); background:var(--jade-soft)}
  .opt.correct .opt-key{background:var(--jade); border-color:var(--jade); color:#fff}
  .opt.correct .verdict{color:var(--jade-deep)}
  .opt.incorrect{border-color:var(--crimson-line); background:var(--crimson-soft)}
  .opt.incorrect .opt-key{background:var(--crimson); border-color:var(--crimson); color:#fff}
  .opt.incorrect .verdict{color:var(--crimson)}
  .opt.dimmed{opacity:.62}
  .mcq-status{margin-top:15px; font-family:var(--mono); font-size:12px; color:var(--ink-faint); min-height:16px}
  .mcq-status.solved{color:var(--jade-deep)}

  /* ---- Chart / intake ---- */
  .chart{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); margin-top:22px; overflow:hidden}
  .chart-top{padding:20px 24px; border-bottom:1px solid var(--line-soft); display:flex; flex-wrap:wrap; gap:16px 32px}
  .vital{min-width:118px}
  .vital .k{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint)}
  .vital .v{font-weight:700; font-size:16px; margin-top:3px}
  .chart-body{padding:20px 24px}
  .cc{font-family:var(--serif); font-size:21px; line-height:1.4; font-style:italic; margin:0 0 17px; padding-left:16px; border-left:3px solid var(--jade)}
  .findings{list-style:none; margin:0; padding:0; display:grid; gap:11px}
  .findings li{display:flex; gap:12px; align-items:flex-start; font-size:15.5px}
  .findings .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--jade-deep); background:var(--jade-soft); padding:3px 8px; border-radius:5px; flex:0 0 auto; margin-top:1px}
  .task{margin-top:20px; background:var(--surface-2); border:1px dashed var(--jade-line); border-radius:12px; padding:15px 17px}
  .task .k{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--jade-deep); margin-bottom:6px}
  .etyintro{font-family:var(--serif); font-style:italic; font-size:14px; color:var(--ink-soft); margin:10px 0 0; line-height:1.55}
  .task p{margin:0; font-size:15.5px; line-height:1.55}

  .groupbox{margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:20px 24px}
  .groupbox label{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--jade); margin-bottom:6px}
  .groupbox .h{font-family:var(--serif); font-style:italic; color:var(--ink-soft); font-size:14.5px; margin:0 0 12px}
  .tb-head{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
  .tb-head > label{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--jade); margin:0}
  .tb-group{display:flex; align-items:center; gap:8px}

<script>
/* ===================== CASE ===================== */
const CASE = {
  patient:"Jamie Rodriguez, 22", role:"Collegiate soccer player", side:"Right lower limb",
  mechanism:"Direct blow to the lateral knee",
  cc:"\u201CI can\u2019t lift my foot up and my shin feels numb.\u201D",
  findings:[
    ["motor","Cannot dorsiflex the right foot"],
    ["motor","Foot eversion is weak"],
    ["sensory","Numbness over the anterolateral leg and dorsum of the foot"],
    ["spared","Plantarflexion is preserved"],
    ["exam","Mild lateral knee pain; struck yesterday during a match"]
  ],
  task:"Work region by region, superior to inferior. For each region: read the assigned pages in Grant\u2019s Dissector, identify the listed structures on the prosection and tick them off, then answer the Case File Question at your table."
};

/* ===================== STRUCTURES =====================
   key = stable identity; same key across regions = same structure (global tick) */
const n=(name,children,o={})=>({name,children:children||null,org:!!o.org,key:o.key||name.toLowerCase().replace(/[^a-z0-9]+/g,'-')});

const REGIONS = [
  /* ---------- 1 ---------- */
  {
    title:"Skeleton Framework", pages:"213\u2013214",
    pagesNote:"Read these pages before you begin, then work through the bony landmarks on the prosection and articulated skeleton.",
    fig:"Pelvis, femur, and proximal leg \u2014 bony landmarks",
    groups:[
      { type:"Bone", items:[
        n("Hip bone (innominate bone)",[n("ilium"),n("ischium"),n("pubis"),n("iliac crest"),n("anterior superior iliac spine"),n("anterior inferior iliac spine"),n("acetabulum"),n("obturator foramen"),n("pubic tubercle"),n("pecten pubis"),n("superior pubic ramus"),n("inferior pubic ramus")],{org:true}),
        n("Femur",[n("greater trochanter"),n("lesser trochanter"),n("intertrochanteric line"),n("lateral epicondyle"),n("lateral condyle of the femur",null,{key:"femur-lat-condyle"}),n("medial epicondyle"),n("medial condyle of the femur",null,{key:"femur-med-condyle"}),n("adductor tubercle")],{org:true}),
        n("Tibia",[n("tibial tuberosity")],{org:true}),
        n("Fibula",[n("fibular head",null,{key:"fibular-head"}),n("fibular neck",null,{key:"fibular-neck"})],{org:true}),
        n("patella")
      ]}
    ],
    mcq:{
      stem:"Considering only the skeleton, which landmark is most exposed to a direct blow from the lateral side?",
      options:[
        {t:"The lesser trochanter, set deep on the medial femur.",correct:false,fb:"It sits deep and medial, shielded by the thigh muscles. A lateral blow could not reach it."},
        {t:"The acetabulum, seated deep within the hip bone.",correct:false,fb:"The acetabulum is enclosed within the pelvis and covered by the hip musculature \u2014 well protected."},
        {t:"The fibular neck, lying just beneath the skin laterally.",correct:true,fb:"Palpate it and you will feel bone almost immediately \u2014 barely any muscle or fat intervenes on the lateral side."},
        {t:"The intercondylar fossa, hidden behind the femoral condyles.",correct:false,fb:"This lies on the posterior femur between the condyles, deep inside the knee \u2014 not reachable from the side."},
        {t:"The pecten pubis, along the superior pubic ramus.",correct:false,fb:"This is a deep pelvic ridge, far from the knee and inaccessible to a lateral force."}
      ]
    }
  },
  /* ---------- 2 ---------- */
  {
    title:"Anterior Thigh", pages:"219\u2013225", video:{title:"Lower Limb: Anterior Thigh",url:"https://www.youtube.com/watch?v=2GUdg1LpabI"},
    pagesNote:"Follow the dissector narrative through the femoral triangle and adductor canal as you work.",
    fig:"Anterior thigh \u2014 femoral triangle and adductor canal",
    groups:[
      { type:"Artery", items:[ n("femoral artery",[n("deep artery of the thigh (profunda femoris)",[n("lateral circumflex femoral artery",[n("ascending branch"),n("transverse branch"),n("descending branch")]),n("medial circumflex femoral artery")],{key:"deep-artery-thigh"})]) ]},
      { type:"Nerve", items:[ n("femoral nerve",[n("nerve to vastus medialis"),n("motor branches of the femoral nerve"),n("saphenous nerve")]) ]},
      { type:"Vein", items:[ n("femoral vein") ]},
      { type:"Muscle", tendon:true, items:[ n("sartorius"),n("iliopsoas"),n("pectineus"),n("quadriceps femoris",[n("rectus femoris"),n("vastus lateralis"),n("vastus medialis"),n("vastus intermedius")]),n("tensor fasciae latae") ]},
      { type:"Connective tissue", items:[ n("inguinal ligament"),n("quadriceps femoris tendon"),n("patellar tendon / ligament",null,{key:"patellar-ligament"}),n("iliotibial band") ]},
      { type:"Spaces & openings", items:[ n("femoral triangle"),n("femoral canal"),n("adductor canal",[n("adductor hiatus")]) ]}
    ],
    mcq:{
      stem:"How far down the limb does the femoral nerve's distribution actually extend?",
      options:[
        {t:"It supplies muscles in both the thigh and the leg.",correct:false,fb:"Its motor supply stops at the knee \u2014 no muscle below the knee answers to it."},
        {t:"Its only branch below the knee is a sensory one.",correct:true,fb:"The saphenous nerve carries sensation down the medial leg, but the femoral nerve powers no muscle past the knee."},
        {t:"It becomes the deep fibular nerve at the knee.",correct:false,fb:"The deep fibular nerve comes from the common fibular nerve, a division of the sciatic \u2014 a separate lineage."},
        {t:"It ends entirely above the inguinal ligament.",correct:false,fb:"It passes beneath the inguinal ligament into the femoral triangle and supplies the thigh."},
        {t:"It supplies the adductor group in the medial thigh.",correct:false,fb:"The adductors answer to the obturator nerve; the femoral nerve serves the anterior compartment."}
      ]
    }
  },
  /* ---------- 3 ---------- */
  {
    title:"Medial Thigh", pages:"226\u2013228", video:{title:"Lower Limb: Medial Thigh",url:"https://www.youtube.com/watch?v=xs_B8HqAG6A"},
    pagesNote:"Use the dissector to work through the adductor group and the obturator nerve.",

    groups:[
      { type:"Artery", items:[ n("deep artery of the thigh",[n("perforating arteries")],{key:"deep-artery-thigh"}) ]},

function titleCaseAll(str){

/* Latin/Greek anatomical plurals for the team-name generator. Only the LAST
   word of a structure name is pluralized, and only that word\u2019s own ending
   decides how - a genuine attempt at correct declension, not just "+s". */
const LATIN_NOCHANGE = new Set([
  /* fixed genitive modifiers - these do not inflect for number at all,
     e.g. "extensor hallucis longus" -> "extensores hallucis longi";
     "hallucis" itself never changes. */
  "femoris","hallucis","pollicis","digitorum","indicis","pedis","manus",
  "capitis","corporis","cordis","ossis","nervi","pubis","latae","fasciae"
]);
const LATIN_FOURTH_DECL = new Set([
  /* 4th-declension -us nouns: identical in the nominative plural */
  "processus","meatus","plexus","sinus","hiatus","recessus","ductus","cursus","tractus"
]);
const LATIN_PLURALS = {
  /* 2nd declension masculine, -us -> -i */
  "longus":"longi","magnus":"magni","tertius":"tertii","medius":"medii",
  "minimus":"minimi","maximus":"maximi","profundus":"profundi",
  "internus":"interni","externus":"externi","ramus":"rami","malleolus":"malleoli",
  "radius":"radii","humerus":"humeri","calcaneus":"calcanei","talus":"tali","femur":"femora",
  "meniscus":"menisci","sulcus":"sulci","musculus":"musculi","fasciculus":"fasciculi",
  "quadratus":"quadrati","soleus":"solei","popliteus":"poplitei","annulus":"annuli",
  /* 3rd declension i-stem adjectives, -is -> -es */
  "brevis":"breves","lateralis":"laterales","medialis":"mediales",
  "superficialis":"superficiales","transversalis":"transversales",
  "gracilis":"graciles","communis":"communes",
  /* 1st declension feminine, -a -> -ae */
  "fibula":"fibulae","tibia":"tibiae","patella":"patellae","scapula":"scapulae",
  "vertebra":"vertebrae","fossa":"fossae","lamina":"laminae","fascia":"fasciae",
  "concha":"conchae","sclera":"sclerae","cornea":"corneae","retina":"retinae",
  "ala":"alae","bulla":"bullae","macula":"maculae","papilla":"papillae",
  "trochlea":"trochleae","clavicula":"claviculae","ulna":"ulnae","fovea":"foveae",
  /* 2nd declension neuter, -um -> -a */
  "ilium":"ilia","ischium":"ischia","septum":"septa","acetabulum":"acetabula",
  "labrum":"labra","retinaculum":"retinacula","cranium":"crania","atrium":"atria",
  "antrum":"antra","frenulum":"frenula","capitulum":"capitula","stratum":"strata",
  "vestibulum":"vestibula","operculum":"opercula",
  /* 3rd declension neuter, -en -> -ina */
  "foramen":"foramina","lumen":"lumina",
  /* Greek neuter, -on -> -a */
  "ganglion":"ganglia","acromion":"acromia","olecranon":"olecrana",
  /* irregular */
  "iris":"irides","cornu":"cornua","genu":"genua","crus":"crura",
  "os":"ossa","caput":"capita","corpus":"corpora","vas":"vasa","pes":"pedes",
  "cervix":"cervices","apex":"apices","cortex":"cortices","vertex":"vertices",
  "index":"indices","helix":"helices","matrix":"matrices","appendix":"appendices",
  "atlas":"atlantes"
};
function pluralizeLastWord(str){
  const parts = str.split(' ');
  const i = parts.length-1;
  const lw = parts[i].toLowerCase();

  if(LATIN_NOCHANGE.has(lw)) return str;
  if(LATIN_PLURALS[lw]){ parts[i]=LATIN_PLURALS[lw]; return parts.join(' '); }
  if(/[ie]x$/i.test(lw) && lw.length>3){ parts[i]=lw.slice(0,-2)+'ices'; return parts.join(' '); }
  if(/us$/i.test(lw)){
    if(LATIN_FOURTH_DECL.has(lw)) return str;
    parts[i]=lw.slice(0,-2)+'i'; return parts.join(' ');
  }
  if(/um$/i.test(lw)){ parts[i]=lw.slice(0,-2)+'a'; return parts.join(' '); }
  if(/a$/i.test(lw) && lw.length>1){ parts[i]=lw+'e'; return parts.join(' '); }

  /* Not a recognized Latin/Greek form - treat as English. */
  if(/es$/i.test(lw)) return str;   /* already plural-looking: branches, processes */
  if(/[^aeiou]y$/i.test(lw)){ parts[i]=lw.slice(0,-1)+'ies'; return parts.join(' '); }
  if(/(s|x|z|ch|sh)$/i.test(lw)){ parts[i]=lw+'es'; return parts.join(' '); }
  parts[i]=lw+'s'; return parts.join(' ');
}
function structureNameOptions(){
  const seen=new Set(), out=[];
  Object.keys(KEY_NAME).forEach(function(k){
    let nm=KEY_NAME[k].replace(/\s*\([^)]*\)\s*/g,' ').replace(/\s+/g,' ').trim();  /* drop parentheticals, keep one space */
    if(nm && !seen.has(nm)){ seen.add(nm); out.push(nm); }
  });
  return out;
}
/* A random 15, capitalized and pluralized, picked once per session and then
   held stable so a student's list does not shift if they navigate away and back. */
function teamStructurePool(){
  if(state.teamStructPool && state.teamStructPool.length) return state.teamStructPool;
  const all = structureNameOptions().slice();
  for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=all[i]; all[i]=all[j]; all[j]=t; }
  const pick = all.slice(0, Math.min(15, all.length))
    .map(function(nm){ return titleCaseAll(pluralizeLastWord(nm)); })
    .sort();
  state.teamStructPool = pick;
  save();
  return pick;
}

function paletteFor(key){
  for(let i=0;i<COLOR_PALETTE.length;i++) if(COLOR_PALETTE[i].key===key) return COLOR_PALETTE[i];

}
function applyTheme(key){
  const p = key ? paletteFor(key) : null;
  const root = document.documentElement.style;
  if(!p){ root.removeProperty('--jade'); root.removeProperty('--jade-deep');
          root.removeProperty('--jade-soft'); root.removeProperty('--jade-line'); return; }
  root.setProperty('--jade', p.accent);
  root.setProperty('--jade-deep', p.deep);
  root.setProperty('--jade-soft', p.soft);
  root.setProperty('--jade-line', p.line);
}

/* Original etymology notes written for this activity. Anatomical names are
   almost always plain-language descriptions in Latin or Greek - once you can
   read the roots, the name tells you what to look for. */
const ETYMOLOGY = {
  "Skeleton Framework":[
    ["Acetabulum","Latin for \u201Cvinegar cup.\u201D The hip socket reminded early anatomists of a small vessel used to hold vinegar."],
    ["Malleolus","Latin for \u201Clittle hammer\u201D (a diminutive of malleus). Named for the shape of the ankle bump, not its function."],
    ["Trochanter","From Greek trokhos, \u201Cwheel.\u201D Describes the femur pivoting at the hip like a wheel on an axle."]
  ],
  "Anterior Thigh":[
    ["Sartorius","Latin sartor, \u201Ctailor.\u201D Traditionally explained by the cross-legged, tailor\u2019s-seat position this muscle helps produce."],
    ["Adductor","Latin ad- (\u201Ctoward\u201D) + ducere (\u201Cto lead\u201D) \u2014 literally \u201Cthat which leads toward\u201D the midline."],
    ["Femoral","From femur, the Latin word for \u201Cthigh.\u201D"]
  ],
  "Medial Thigh":[
    ["Obturator","Latin obturare, \u201Cto block up.\u201D Named for the membrane that occludes most of the obturator foramen."],
    ["Brevis / Longus / Magnus","Latin for short, long, and large \u2014 plain descriptive sizing, used by anatomists just as it reads."],
    ["Externus","Latin for \u201Couter,\u201D paired with an internus (\u201Cinner\u201D) elsewhere in the body."]
  ],
  "Knee Joint":[
    ["Meniscus","Greek meniskos, \u201Clittle moon.\u201D Named for its crescent shape."],
    ["Cruciate","Latin crux, \u201Ccross.\u201D The two ligaments cross one another inside the joint."],
    ["Patella","Latin for \u201Csmall dish\u201D (a diminutive of patina, \u201Cshallow pan\u201D)."]
  ],
  "Lower Leg & Foot Skeleton":[
    ["Talus","Latin for \u201Cankle bone.\u201D"],
    ["Calcaneus","From Latin calx, \u201Cheel.\u201D"],
    ["Navicular","Latin navicula, \u201Clittle boat.\u201D The bone\u2019s shape resembles a small boat\u2019s hull."],
    ["Cuneiform","Latin cuneus (\u201Cwedge\u201D) + forma (\u201Cshape\u201D) \u2014 literally \u201Cwedge-shaped.\u201D"]
  ],
  "Lateral Lower Leg":[
    ["Fibula","Latin for \u201Cbrooch\u201D or \u201Cclasp.\u201D Early anatomists thought the paired tibia and fibula resembled the two parts of a clasp pin."],
    ["Retinaculum","Latin retinere, \u201Cto hold back.\u201D A strap that restrains tendons in place."]
  ],
  "Anterior Lower Leg & Dorsum of the Foot":[
    ["Extensor / Flexor","Latin extendere (\u201Cto stretch out\u201D) and flectere (\u201Cto bend\u201D) \u2014 the muscle\u2019s action, named directly."],
    ["Hallucis","The genitive form of hallux, Latin for \u201Cgreat toe.\u201D"],
    ["Dorsum","Latin for \u201Cback.\u201D In anatomy, the upper surface of the foot, as opposed to the sole (planta)."]
  ]
};
function etymologyHTML(title){
  const items = ETYMOLOGY[title];
  if(!items || !items.length) return '';
  return '<section class="etymology"><div class="ety-k">Word Origins</div>'+
    items.map(function(x){ return '<div class="ety-item"><div class="ety-term">'+esc(x[0])+'</div><div class="ety-def">'+esc(x[1])+'</div></div>'; }).join('')+

/* ---- shared floating tooltip: position:fixed, appended once outside any
   scrolling/multi-column container, so opening it can never expand a row,
   panel, or column - it visually floats above everything else instead. ---- */
const floatTip = document.getElementById('floatTip');
let activeTipBtn = null;
function positionFloatTip(anchorEl){
  const r = anchorEl.getBoundingClientRect();
  floatTip.style.left = '0px'; floatTip.style.top = '0px'; /* reset before measuring */
  const tw = floatTip.offsetWidth, th = floatTip.offsetHeight;
  let left = r.right - tw, top = r.bottom + 8;
  if(left < 12) left = 12;
  if(left + tw > window.innerWidth - 12) left = window.innerWidth - tw - 12;
  if(top + th > window.innerHeight - 12) top = r.top - th - 8;
  if(top < 12) top = 12;
  floatTip.style.left = left+'px';
  floatTip.style.top = top+'px';
}
function showFloatTip(anchorEl, html){
  floatTip.innerHTML = html;
  floatTip.classList.add('show');
  positionFloatTip(anchorEl);
  activeTipBtn = anchorEl;
}
function hideFloatTip(){
  floatTip.classList.remove('show');
  activeTipBtn = null;
}
function toggleFloatTip(anchorEl, html){
  if(activeTipBtn === anchorEl){ hideFloatTip(); return; }
  showFloatTip(anchorEl, html);
}
document.addEventListener('click', hideFloatTip);
window.addEventListener('scroll', hideFloatTip, true);
window.addEventListener('resize', ()=>{ if(activeTipBtn) positionFloatTip(activeTipBtn); });

function wireStructs(ri){
  const p=document.getElementById('rstructs'); if(!p) return;
  /* Ticking a structure updates only the row, the region meter, and the overall
     badge - it deliberately never calls render(), which is what used to jump the
     page back to the top on every click (render() always scrolls to top for
     genuine page navigation, which this is not). */
  p.querySelectorAll('.sline').forEach(row=>row.addEventListener('click',()=>{
    const k=row.dataset.sk;
    if(state.seen[k]) delete state.seen[k]; else state.seen[k]={ri:ri};
    save();
    row.classList.toggle('seen', !!state.seen[k]);
    updateBadge();
    const ks=regionKeys(ri), sn=ks.filter(kk=>state.seen[kk]).length;
    const fill=document.getElementById('rFill'), txt=document.getElementById('rTxt');
    if(fill) fill.style.width = Math.round(sn/ks.length*100)+'%';
    if(txt) txt.textContent = sn+' / '+ks.length;
  }));
  p.querySelectorAll('.shelp').forEach(h=>h.addEventListener('click',e=>{
    e.stopPropagation();
    const k=h.dataset.tipfor, nm=KEY_NAME[k]||'', tip=TIPS[k]||'';
    toggleFloatTip(h, '<b>'+esc(nm)+'</b><br>'+esc(tip));
  }));

    p.classList.toggle('collapsed',state.collapsed[ri]); c.textContent=state.collapsed[ri]?'\u25BE':'\u25B4'; save();});
  const hq=document.getElementById('helpQ');
  if(hq) hq.addEventListener('click',e=>{
    e.stopPropagation();
    toggleFloatTip(hq, 'A <b>structure</b> is any named anatomical entity you can point to on the prosection \u2014 a muscle, nerve, artery, vein, bone, bony landmark, ligament, or space.');
  });
}

function wireMCQ(){
  stage.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>{
    const key=btn.dataset.key, idx=+btn.dataset.idx;
    if(!state.answered[key]) state.answered[key]={revealed:[],solved:false};
    const rec=state.answered[key];
    if(rec.revealed.includes(idx)) return;
    rec.revealed.push(idx);

    if(rec.solved){s.classList.add('solved');s.textContent='Solved \u2014 explore the other options to see why they don\u2019t fit.';}
    else{const l=opts.length-rec.revealed.length; s.textContent='Keep going \u2014 read the feedback and try another. '+l+' option'+(l===1?'':'s')+' left.';}
    buildRail();
  }));
}

const hlBtn=document.getElementById('hlBtn');
function stepKey(){return 's'+state.step;}
document.addEventListener('mouseup',e=>{
  if(e.target.closest('.notebook')||e.target.closest('#hlBtn')) return;
  setTimeout(()=>{
    const sel=window.getSelection();
    if(!sel||sel.isCollapsed||!sel.toString().trim()||sel.toString().trim().length<3){hlBtn.classList.remove('show');return;}
    if(!stage.contains(sel.anchorNode)){hlBtn.classList.remove('show');return;}
    const r=sel.getRangeAt(0).getBoundingClientRect();
    hlBtn.style.left=(window.scrollX+r.left)+'px';
    hlBtn.style.top=(window.scrollY+r.bottom+8)+'px';
    hlBtn.classList.add('show');
  },10);
});
hlBtn.addEventListener('mousedown',e=>e.preventDefault());
hlBtn.addEventListener('click',()=>{
  const sel=window.getSelection(); if(!sel||sel.isCollapsed) return;
  const t=sel.toString().trim(); if(t.length<3) return;
  const k=stepKey(); if(!state.highlights[k]) state.highlights[k]=[];
  if(!state.highlights[k].includes(t)) state.highlights[k].push(t);
  save(); sel.removeAllRanges(); hlBtn.classList.remove('show');
  applyHighlights(); renderHlList();
});
function applyHighlights(){
  const list=state.highlights[stepKey()]||[];
  if(!list.length) return;
  list.forEach(txt=>{
    const walker=document.createTreeWalker(stage,NodeFilter.SHOW_TEXT,{
      acceptNode:nd=>(nd.parentNode&&nd.parentNode.nodeName!=='MARK'&&nd.nodeValue.indexOf(txt)>=0)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
    const hits=[]; let nd; while((nd=walker.nextNode())) hits.push(nd);
    hits.forEach(node=>{
      const i=node.nodeValue.indexOf(txt); if(i<0) return;
      const rng=document.createRange(); rng.setStart(node,i); rng.setEnd(node,i+txt.length);
      const m=document.createElement('mark'); m.className='hl';
      try{rng.surroundContents(m);}catch(e){}
    });
  });
}
function renderHlList(){
  const box=document.getElementById('hlList');
  const all=[];
  Object.keys(state.highlights).forEach(k=>(state.highlights[k]||[]).forEach(t=>all.push([k,t])));
  if(!all.length){box.innerHTML='<div class="hl-empty">Select any text in the activity and choose Highlight.</div>';return;}
  box.innerHTML=all.map(([k,t],i)=>'<div class="hl-item"><span class="sw"></span><span style="flex:1">'+esc(t)+'</span>'+
    '<button class="rm" data-k="'+k+'" data-t="'+esc(t).replace(/"/g,'&quot;')+'" aria-label="Remove">✕</button></div>').join('');
  box.querySelectorAll('.rm').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k, t=b.getAttribute('data-t').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
    state.highlights[k]=(state.highlights[k]||[]).filter(x=>x!==t); save(); renderHlList(); render();
  }));
}

(function(){
  const inField=t=>t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT');
  ['copy','cut','dragstart','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{if(!inField(e.target)) e.preventDefault();}));

/* ---- confetti ---- */
function confetti(){
  try{
  const c=document.createElement('canvas');
  c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200';
  document.body.appendChild(c);
  const ctx=c.getContext&&c.getContext('2d'); if(!ctx){c.remove();return;}
  const W=c.width=window.innerWidth||1200, H=c.height=window.innerHeight||800;
  const cols=['#1C7A6A','#B07A22','#A63A44','#125A4E','#FBEBA0','#B7D8D0'];
  const P=[];
  for(let i=0;i<140;i++) P.push({
    x:Math.random()*W, y:-20-Math.random()*H*0.5,
    w:6+Math.random()*7, h:8+Math.random()*9,
    vy:2+Math.random()*3.4, vx:-1.3+Math.random()*2.6,
    a:Math.random()*Math.PI, va:-0.12+Math.random()*0.24,
    col:cols[(Math.random()*cols.length)|0]
  });
  let t=0;
  (function frame(){
    t++; ctx.clearRect(0,0,W,H);
    P.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.vy+=0.015;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
      ctx.fillStyle=p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if(t<300) requestAnimationFrame(frame); else c.remove();
  })();
  }catch(e){/* animation is decorative only */}
}
function showClosing(){
  if(document.getElementById('closingCard')) return;
  const box=document.createElement('section');
  box.id='closingCard'; box.className='closing';
  box.innerHTML='<div class="cl-k">Submitted</div>'+
    '<h3>Nice work\u2014Your results are on their way.</h3>'+
    '<p>Dr. G. will post the answer key to this lab on Elentra so you have these resources to study from.</p>';
  const sb=document.querySelector('.submitbox');
  sb.parentNode.insertBefore(box,sb.nextSibling);
  try{ box.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){}
}

/* ---- submission ---- */
function buildRows(){
  const rows=[['Section','Item','Detail','Value']];
  rows.push(['Meta','Group number','',state.group||'(not entered)']);
  rows.push(['Meta','Team name','',state.teamName||'(not set)']);
  rows.push(['Meta','Completed',' ',new Date().toLocaleString()]);
  rows.push(['Meta','Structures identified','of '+STRUCT_TOTAL,String(Object.keys(state.seen).length)]);
  if(state.roles&&state.roles.length===5){ state.roles.forEach(function(k,i){
    rows.push(['Roles','Student '+(i+1),'',roleByKey(k).slot]); }); }
  else rows.push(['Roles','','','not assigned']);
  REGIONS.forEach((r,ri)=>{
    regionEntries(ri).forEach(([k,nm,ty])=>{
      const rec=state.seen[k];
      rows.push(['Structures',r.title,ty+': '+nm,rec?(rec.ri===ri?'checked here':'checked in '+REGIONS[rec.ri].title):'not checked']);
    });
  });
  REGIONS.forEach((r,ri)=>{
    const rec=state.answered['r'+ri];
    const touched=rec?rec.revealed.map(i=>String.fromCharCode(65+i)).join(' '):'';
    rows.push(['Question',r.title,'options touched: '+(touched||'none'),rec&&rec.solved?'solved':'not solved']);
  });
  const sy=state.answered['synth'];
  rows.push(['Question','Synthesis','options touched: '+(sy?sy.revealed.map(i=>String.fromCharCode(65+i)).join(' '):'none'),sy&&sy.solved?'solved':'not solved']);
  SYNTH.write.forEach((w,i)=>rows.push(['Written',w[0],'',(state.notes[i]||'').replace(/\s+/g,' ').trim()||'(blank)']));
  rows.push(['Notebook','Running notes','',(state.notebook||'').replace(/\s+/g,' ').trim()||'(blank)']);
  Object.keys(state.highlights).forEach(k=>(state.highlights[k]||[]).forEach(t=>rows.push(['Highlight',k,'',t])));
  return rows;
}
function toCSV(rows){
  return rows.map(r=>r.map(c=>{const s=String(c==null?'':c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\r\n');
}
function ensureGroup(){
  if(state.group&&state.group.trim()) return true;
  const g=window.prompt('Enter your group number before submitting:','');
  if(g&&g.trim()){state.group=g.trim();save();return true;}
  alert('A group number is required to submit.');
  return false;
}
function downloadCSV(){
  const csv=toCSV(buildRows());
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='lower-limb-case_group-'+(state.group||'NA')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function buildSubmissionPayload(){
  const seenN=Object.keys(state.seen).length;
  let solved=0; for(let i=2;i<TOTAL;i++) if(solvedAt(i)) solved++;
  const regionAnswers=REGIONS.map((r,ri)=>{
    const rec=state.answered['r'+ri];
    return r.title+': '+(rec?rec.revealed.map(i=>String.fromCharCode(65+i)).join(' '):'none')+(rec&&rec.solved?' [solved]':'');
  }).join(' | ');
  const sy=state.answered['synth'];
  const synthesisAnswer=(sy?sy.revealed.map(i=>String.fromCharCode(65+i)).join(' '):'none')+(sy&&sy.solved?' [solved]':'');
  const missing=[]; ALL_KEYS.forEach(k=>{if(!state.seen[k]) missing.push(KEY_NAME[k]||k);});
  const highlightList=[]; Object.keys(state.highlights).forEach(k=>(state.highlights[k]||[]).forEach(t=>highlightList.push(t)));
  const roles=(state.roles&&state.roles.length===5)?state.roles.map(k=>roleByKey(k).slot).join(' | '):'not assigned';
  return {
    timestamp:new Date().toISOString(),
    group:state.group||'',
    teamName:state.teamName||'',
    roles:roles,
    structuresIdentified:seenN,
    structuresTotal:STRUCT_TOTAL,
    structuresMissed:missing.length?missing.join(', '):'none',
    questionsSolved:solved,
    questionsTotal:(TOTAL-2),
    regionAnswers:regionAnswers,
    synthesisAnswer:synthesisAnswer,
    structureFunctionDysfunction:SYNTH.write.map((w,i)=>w[0]+': '+((state.notes[i]||'').trim()||'(blank)')).join(' | '),
    notebook:(state.notebook||'').replace(/\s+/g,' ').trim(),
    highlights:highlightList.join(' | ')
  };
}
function submit(mode){
  if(!ensureGroup()) return;
  if(mode==='csv'){
    downloadCSV();
    state.submitted=true; save();
    showClosing(); confetti();
    return;
  }
  /* mode === 'sheet' */
  if(!SUBMIT_ENDPOINT){
    alert('Submission isn\u2019t connected yet, so a CSV will download instead \u2014 check with your instructor about where to turn it in.');
    downloadCSV();
    state.submitted=true; save();
    showClosing(); confetti();
    return;
  }
  const payload=buildSubmissionPayload();
  fetch(SUBMIT_ENDPOINT,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  }).catch(()=>{
    /* mode:'no-cors' makes the response opaque, so a rejection here only
       ever means the request never left the browser (offline, a bad
       endpoint URL, etc.) \u2014 not a server-side error. Fall back to a
       CSV so nothing is lost. */
    downloadCSV();
  }).finally(()=>{
    state.submitted=true; save();
    showClosing(); confetti();
  });
}

/* ---- mobile rail ---- */
const rail=document.getElementById('rail'), railScrim=document.getElementById('railScrim');
document.getElementById('railToggle').addEventListener('click',()=>{rail.classList.add('open');railScrim.classList.add('open');});
function closeRail(){rail.classList.remove('open');railScrim.classList.remove('open');}
railScrim.addEventListener('click',closeRail);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeRail();nbClose();hlBtn.classList.remove('show');}});

/* ---- onboarding tour ---- */
const TOUR_KEY="fll_tour_v1";
let tourIdx=-1, tourCleanup=null, tourOrigStep=null;

function tourResolveTarget(step){
  return typeof step.selector==='function' ? step.selector() : document.querySelector(step.selector);
}
/* Some tour stops (the structure checklist, the tooltip button) only exist on a
   region page, but the tour can start from the intake screen. If a step needs
   a particular page, switch to it for a look and switch back once we're past
   that part of the tour \u2014 nothing here is saved, so it never counts as real
   navigation. */
function tourEnsureStep(step){
  if(typeof step.nav==='number'){
    if(tourOrigStep===null) tourOrigStep=state.step;
    if(state.step!==step.nav){ state.step=step.nav; render(); }
  } else if(tourOrigStep!==null && state.step!==tourOrigStep){
    state.step=tourOrigStep; render();
  }
}

const TOUR_STEPS=[
  {type:'modal', k:'Welcome',
    title:'A quick orientation',
    text:'This lab walks you region by region through the anterior lower limb. Before you dive in, here\u2019s a 30-second look at the controls you\u2019ll use along the way.'},
  {type:'spot', k:'Navigate',
    selector:()=>{ const t=document.getElementById('railToggle'); return (t&&t.offsetParent)?t:document.querySelector('.rail-head'); },
    title:'Find your way around',
    text:'This opens the full path through the case. Regions work best in order, but you can jump to any of them at any time.'},
  {type:'spot', k:'Check off', nav:2, selector:'.rstructs .sline',
    title:'Check off what you find',
    text:'Once you\u2019ve identified a structure on the prosection, tap it here. It fills in and counts toward the tally at the top \u2014 tap again to undo.'},
  {type:'spot', k:'Quick tips', nav:2, selector:'.shelp',
    title:'Need a hint?',
    text:'Tap the small ? next to any structure for a short identification tip \u2014 where to look and what to feel for.'},
  {type:'spot', k:'Progress', selector:'#structCount',
    title:'Track what you\u2019ve found',
    text:'This counts every structure you\u2019ve checked off across the whole case \u2014 not just the region you\u2019re on.'},
  {type:'spot', k:'Notebook', selector:'#nbOpen',
    title:'Keep running notes',
    text:'Open your notebook any time to jot observations or questions for your instructor. It saves automatically and carries through to Synthesis.'},
  {type:'spot', k:'Highlight', selector:'#hlBtn',
    title:'Save a passage',
    text:'Select any text in the lab and this button appears \u2014 tap it to send that passage straight into your notebook.',
    prep(){
      const b=document.getElementById('hlBtn');
      b.dataset.tourPrevStyle=b.getAttribute('style')||'';
      const tb=document.querySelector('.topbar').getBoundingClientRect();
      b.style.left=(window.scrollX+tb.left+16)+'px';
      b.style.top=(window.scrollY+tb.bottom+10)+'px';
      b.classList.add('show','tour-demo');
    },
    cleanup(){
      const b=document.getElementById('hlBtn');
      b.classList.remove('show','tour-demo');
      b.setAttribute('style', b.dataset.tourPrevStyle||'');
      delete b.dataset.tourPrevStyle;
    }},
  {type:'modal', k:'Ready',
    title:'You\u2019re ready',
    text:'Work each region in order: read the pages, find the structures, and answer the Case File Question. Finish at Synthesis to submit. Replay this tour any time from the \u25ce Tour button above.'}
];

function tourClearVisuals(){
  const ov=document.getElementById('tourOverlay'); if(ov) ov.remove();
  document.querySelectorAll('.tour-spot,.tour-card').forEach(n=>n.remove());
  if(tourCleanup){ try{ tourCleanup(); }catch(e){} tourCleanup=null; }
}
function tourEnd(){
  tourClearVisuals();
  if(tourOrigStep!==null && state.step!==tourOrigStep){ state.step=tourOrigStep; render(); }
  tourOrigStep=null;
  try{ localStorage.setItem(TOUR_KEY,'1'); }catch(e){}
}
function tourGo(idx,dir){
  dir = dir || 1;
  if(idx<0 || idx>=TOUR_STEPS.length){ tourEnd(); return; }
  const step=TOUR_STEPS[idx];
  tourEnsureStep(step);
  const target = step.type==='spot' ? tourResolveTarget(step) : null;
  if(step.type==='spot' && !target){ tourGo(idx+dir,dir); return; }

  tourClearVisuals();
  tourIdx=idx;
  if(step.prep) step.prep();

  const overlay=document.createElement('div'); overlay.className='tour-overlay'; overlay.id='tourOverlay';
  overlay.addEventListener('click',tourEnd);
  document.body.appendChild(overlay);

  const card=document.createElement('div'); card.className='tour-card'+(target?'':' center');
  const dots='<div class="tour-dots">'+TOUR_STEPS.map((s,i)=>'<span class="'+(i===idx?'active':'')+'"></span>').join('')+'</div>';
  card.innerHTML='<div class="tour-k">'+esc(step.k)+'</div>'+
    '<h4 class="tour-title">'+esc(step.title)+'</h4>'+
    '<p class="tour-text">'+esc(step.text)+'</p>'+dots+
    '<div class="tour-row"><button class="tour-skip" id="tourSkip">Skip tour</button>'+
    '<div class="tour-nav">'+(idx>0?'<button class="nav-btn" id="tourBack">\u2190 Back</button>':'')+
    '<button class="nav-btn primary" id="tourNext">'+(idx===TOUR_STEPS.length-1?'Start the lab':'Next \u2192')+'</button></div></div>';
  card.addEventListener('click',e=>e.stopPropagation());
  document.body.appendChild(card);

  let spot=null;
  if(target){
    spot=document.createElement('div'); spot.className='tour-spot';
    document.body.appendChild(spot);
    target.scrollIntoView({block:'center',behavior:'smooth'});
  }
  requestAnimationFrame(()=>{
    if(target && spot){
      const r=target.getBoundingClientRect(), pad=8;
      spot.style.left=(r.left-pad)+'px'; spot.style.top=(r.top-pad)+'px';
      spot.style.width=(r.width+pad*2)+'px'; spot.style.height=(r.height+pad*2)+'px';
      const cardH=card.offsetHeight||220, cardW=card.offsetWidth||320;
      let top=r.bottom+16;
      if(top+cardH>window.innerHeight-12) top=Math.max(12,r.top-cardH-16);
      let left=Math.min(Math.max(12,r.left),window.innerWidth-cardW-12);
      card.style.top=top+'px'; card.style.left=left+'px';
    }
  });

  document.getElementById('tourSkip').addEventListener('click',e=>{e.stopPropagation();tourEnd();});
  document.getElementById('tourNext').addEventListener('click',e=>{e.stopPropagation(); tourGo(idx+1,1);});
  const back=document.getElementById('tourBack');
  if(back) back.addEventListener('click',e=>{e.stopPropagation();tourGo(idx-1,-1);});

  tourCleanup=step.cleanup||null;
}
function tourStart(){ tourGo(0,1); }
document.getElementById('tourBtn').addEventListener('click',tourStart);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && document.getElementById('tourOverlay')) tourEnd(); });

/* ---- init ---- */
applyTheme(state.teamColor);
render(); renderHlList();
(function(){
  let seen=false;
  try{ seen = localStorage.getItem(TOUR_KEY)==='1'; }catch(e){}
  if(!seen) setTimeout(tourStart, 500);
})();
</script>
